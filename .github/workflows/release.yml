name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    name: Create Release
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk

      - name: Restore online OCR dependencies
        run: dotnet restore ./EasyChat/EasyChat.csproj -r win-x64 -p:UseBundledOcrModels=false

      - name: Publish EasyChat (online OCR channel)
        run: dotnet publish ./EasyChat/EasyChat.csproj -c Release -r win-x64 --self-contained false --no-restore -p:UseBundledOcrModels=false -o ./publish-online

      - name: Restore bundled OCR dependencies
        run: dotnet restore ./EasyChat/EasyChat.csproj -r win-x64 -p:UseBundledOcrModels=true

      - name: Publish EasyChat (bundled OCR channel)
        run: dotnet publish ./EasyChat/EasyChat.csproj -c Release -r win-x64 --self-contained false --no-restore -p:UseBundledOcrModels=true -o ./publish-bundled

      - name: Get Version
        id: get_version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "Used Tag Version: $VERSION"
          else
            VERSION=$(dotnet msbuild EasyChat/EasyChat.csproj -getProperty:Version)
            echo "Used CSPROJ Version: $VERSION"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Download Previous Release Assets
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p Releases
          gh release download -p "RELEASES*" -p "assets.*.json" -p "releases.*.json" -p "*.nupkg" --dir ./Releases || echo "No previous release found, skipping delta generation."
        
      - name: Pack online Velopack channel (win compatibility channel)
        run: |
          vpk pack -u EasyChat -v ${{ env.VERSION }} -p ./publish-online -e EasyChat.exe -c win -o ./Releases

      - name: Pack bundled Velopack channel
        run: |
          vpk pack -u EasyChat -v ${{ env.VERSION }} -p ./publish-bundled -e EasyChat.exe -c bundled -o ./Releases

      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          ./.github/scripts/generate-release-notes.ps1
          -Repository "${{ github.repository }}"
          -Tag "${{ github.ref_name }}"
          -OutputPath "artifacts/release-notes.md"
          -ExistingBody ([string]::Empty)

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          body_path: artifacts/release-notes.md
          files: |
            Releases/*Setup.exe
            Releases/*.zip
            Releases/*-${{ env.VERSION }}-delta.nupkg
            Releases/*-${{ env.VERSION }}-full.nupkg
            Releases/RELEASES*
            Releases/assets.*.json
            Releases/releases.*.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Setup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EasyChat-Setup
          path: |
            Releases/*Setup.exe

      - name: Upload Portable
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: EasyChat-Portable
          path: |
            Releases/*.zip

      - name: Upload Velopack Assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Velopack-Assets
          path: |
             Releases/*-${{ env.VERSION }}-delta.nupkg
             Releases/*-${{ env.VERSION }}-full.nupkg
             Releases/RELEASES*
             Releases/assets.*.json
             Releases/releases.*.json
